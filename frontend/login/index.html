<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تسجيل الدخول — Cafe System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/common.css">
  <style>
    :root {
      --font-cairo: 'Cairo', system-ui, -apple-system, sans-serif;
      --bg-dark: #07090e;
      --card-bg-start: rgba(22, 27, 38, 0.92);
      --card-bg-end: rgba(14, 17, 25, 0.95);
      --card-border: rgba(255, 255, 255, 0.09);
      --input-bg: rgba(255, 255, 255, 0.03);
      --input-border: rgba(255, 255, 255, 0.09);
      --primary: #4f46e5;
      --primary-hover: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-cairo);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse 70% 70% at 50% -15%, rgba(99, 102, 241, 0.22), transparent),
        radial-gradient(ellipse 50% 50% at 85% 100%, rgba(59, 130, 246, 0.12), transparent);
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      color: var(--text-main);
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    }

    .login-container {
      width: 100%;
      max-width: 410px;
      position: relative;
      z-index: 1;
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card {
      background: linear-gradient(155deg, var(--card-bg-start) 0%, var(--card-bg-end) 100%);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: clamp(2rem, 6vw, 2.75rem);
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 0 25px rgba(99, 102, 241, 0.03);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 35px 70px -15px rgba(0, 0, 0, 0.88),
        0 0 35px rgba(99, 102, 241, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon-box {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(59, 130, 246, 0.08));
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .brand-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .brand-highlight {
      background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1.35rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon {
      position: absolute;
      right: 14px;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      padding-right: 44px;
      padding-left: 44px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      transition: all 0.2s ease;
    }

    .form-group input::placeholder {
      color: #4b5563;
    }

    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--primary-hover);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .input-wrapper:focus-within .input-icon {
      color: #818cf8;
    }

    .password-toggle-btn {
      position: absolute;
      left: 10px;
      background: transparent;
      border: none;
      color: #6b7280;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background-color 0.2s;
    }

    .password-toggle-btn:hover {
      color: #e5e7eb;
      background: rgba(255, 255, 255, 0.06);
    }

    /* Minimalist Password Digit Counter */
    .password-sub-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 0.4rem;
      padding: 0 0.15rem;
    }

    .digit-count-pill {
      font-size: 0.78rem;
      color: #6b7280;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s ease;
    }

    .digit-count-num {
      font-weight: 700;
      color: #9ca3af;
      transition: color 0.2s ease;
    }

    .digit-count-pill.has-value .digit-count-num {
      color: #818cf8;
    }

    .btn-login {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.96rem;
      border: none;
      border-radius: 12px;
      margin-top: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca 0%, #2563eb 100%);
      box-shadow: 0 6px 24px rgba(79, 70, 229, 0.5);
      transform: translateY(-1px);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-box {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
      animation: shake 0.4s ease-in-out;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
            <line x1="6" y1="1" x2="6" y2="4"></line>
            <line x1="10" y1="1" x2="10" y2="4"></line>
            <line x1="14" y1="1" x2="14" y2="4"></line>
          </svg>
        </div>
        <h1 class="brand-title">مرحباً بك في <span class="brand-highlight">Cafe System</span></h1>
        <p class="brand-subtitle">سجّل الدخول بحسابك للوصول إلى لوحة التحكم والواجهة الخاصة بك</p>
      </div>

      <form id="loginForm" novalidate autocomplete="off">
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <div class="input-wrapper">
            <input type="email" id="email" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="example@cafezip.com" required>
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <div class="input-wrapper">
            <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" required>
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <button type="button" id="passwordToggleBtn" class="password-toggle-btn" aria-label="إظهار كلمة المرور">
              <span id="passwordToggleIcon">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </span>
            </button>
          </div>
          <div class="password-sub-bar">
            <span class="digit-count-pill" id="digitCountPill">
              <span id="charCountNum" class="digit-count-num">0</span>
              <span>رقم/حرف</span>
            </span>
          </div>
        </div>

        <div id="errorBox" class="error-box" role="alert"></div>

        <button type="submit" id="submitBtn" class="btn-login">
          <span id="submitBtnText">تسجيل الدخول</span>
        </button>
      </form>
    </div>
  </div>

  <script src="../js/saas-auth.js"></script>
  <script src="saas-login.js"></script>
</body>

</html>
